version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # The app moved from `web/` to the repository root when the .NET stack was deleted. The nuget
  # and docker ecosystems went with it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      app-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # The measurement workbench pins Playwright and is not part of the shipped app, so it updates
  # on its own schedule rather than inside the app's group.
  - package-ecosystem: npm
    directory: /tools/measure-browser
    schedule:
      interval: weekly
      day: monday
    groups:
      measure-browser-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2
