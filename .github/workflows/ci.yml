name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull request pushes may cancel stale work. Main pushes must not: release automation runs after
  # CI completes on main, so canceling a superseded main run would also discard that PR's
  # release label before the version job can read it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job. The .NET, probe-catalog and container jobs this replaces are gone along with the stack
# they verified, and what remains -- typecheck, tests, build -- shares a single `npm ci` and runs
# in well under a minute. Splitting it would cost three dependency installs to parallelise work
# that is already faster than the installs.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Test release policy
        run: node .github/scripts/release-policy.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # `npm run lint` existed and was failing on `main` with two `no-useless-escape` errors,
      # because nothing ever ran it. A script that is not in CI is a script that rots.
      - name: Lint
        run: npm run lint

      # `tsc -b`, not `tsc --noEmit`. The latter reports TS6305 against `src/services/*` because
      # the Rayfin project references have not been built, and the build is what reads the
      # `*.test.ts` files -- a test constructing a contract value with a string literal outside
      # its union type passes the suite, since Vitest strips types, and fails here.
      - name: Build
        run: npm run build
