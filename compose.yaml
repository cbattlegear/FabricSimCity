services:
  sqlsimcity:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - sqlsimcity-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

volumes:
  sqlsimcity-data:
